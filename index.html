<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沙尘扩散浓度场体积可视化</title>
</head>
<body>
  <div id="app">
    <!-- 区域一：数据加载（左侧栏顶部） -->
    <aside class="sidebar">
      <header class="brand">
        <div class="brand-mark">DUST</div>
        <div>
          <h1>沙尘浓度场</h1>
          <p>体绘制可视化工具</p>
        </div>
      </header>

      <section class="panel" id="panel-data">
        <h2><span class="idx">1</span>数据加载</h2>
        <div class="panel-body">
          <div class="data-status" id="data-status">
            <span class="dot" id="data-dot"></span>
            <span id="data-status-text">尚未加载体数据</span>
          </div>
          <dl class="meta-grid" id="data-meta">
            <dt>网格尺寸</dt><dd id="meta-dims">—</dd>
            <dt>时刻数</dt><dd id="meta-frames">—</dd>
            <dt>浓度范围</dt><dd id="meta-range">—</dd>
          </dl>
          <div class="progress-track" hidden id="load-progress-track">
            <div class="progress-fill" id="load-progress-fill"></div>
          </div>
          <div class="btn-row">
            <button class="btn" id="btn-load-demo">加载演示数据</button>
            <label class="btn btn-ghost" for="file-input">导入 .dustvol</label>
            <input type="file" id="file-input" accept=".dustvol,application/octet-stream" hidden />
          </div>
          <p class="hint">演示数据由本地生成器写入 <code>public/</code>；也支持直接导入同格式二进制文件。</p>
        </div>
      </section>

      <!-- 区域三：阈值与切片控制 -->
      <section class="panel" id="panel-slice">
        <h2><span class="idx">3</span>阈值与切片控制</h2>
        <div class="panel-body">
          <div class="control">
            <div class="control-head">
              <label>浓度阈值</label>
              <output id="threshold-value">L3</output>
            </div>
            <input type="range" id="threshold-slider" min="0" max="4" step="1" value="2" list="tick-marks" />
            <datalist id="tick-marks">
              <option value="0"></option><option value="1"></option>
              <option value="2"></option><option value="3"></option>
              <option value="4"></option>
            </datalist>
            <div class="level-row" id="level-labels"></div>
            <p class="hint" id="threshold-desc"></p>
          </div>

          <div class="control">
            <div class="control-head">
              <label>切片层数</label>
              <output id="slice-value">64 层</output>
            </div>
            <input type="range" id="slice-slider" min="32" max="128" step="8" value="64" />
            <div class="range-foot"><span>32</span><span>128</span></div>
          </div>

          <div class="control">
            <div class="control-head"><label>纹理烘焙状态</label></div>
            <div class="bake-status" id="bake-status">
              <span class="dot dot-idle"></span><span id="bake-status-text">空闲</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 区域四：时间序列播放 -->
      <section class="panel" id="panel-time">
        <h2><span class="idx">4</span>时间序列播放</h2>
        <div class="panel-body">
          <div class="control-head">
            <label>当前时刻</label>
            <output id="time-value">t = 0</output>
          </div>
          <input type="range" id="time-slider" min="0" max="17" step="0.01" value="0" />
          <div class="btn-row">
            <button class="btn btn-icon" id="btn-play" title="播放 / 暂停">▶</button>
            <button class="btn btn-icon" id="btn-step-back" title="上一帧">⏮</button>
            <button class="btn btn-icon" id="btn-step-fwd" title="下一帧">⏭</button>
          </div>
          <div class="control">
            <div class="control-head"><label>播放速度</label></div>
            <div class="seg" id="speed-seg">
              <button data-speed="0.5">0.5×</button>
              <button data-speed="1" class="active">1×</button>
              <button data-speed="2">2×</button>
              <button data-speed="4">4×</button>
            </div>
          </div>
          <div class="control">
            <label class="check"><input type="checkbox" id="loop-check" checked /> 循环播放</label>
          </div>
        </div>
      </section>

      <!-- 导出 -->
      <section class="panel" id="panel-export">
        <h2>导出</h2>
        <div class="panel-body">
          <div class="btn-row">
            <button class="btn" id="btn-export-png">导出图片 PNG</button>
            <button class="btn" id="btn-export-json">导出摘要 JSON</button>
          </div>
          <p class="hint">JSON 含当前时刻的浓度分布统计、阈值与切片配置。</p>
        </div>
      </section>
    </aside>

    <!-- 区域二：三维体视图 -->
    <main class="viewport" id="viewport">
      <canvas id="gl-canvas"></canvas>

      <div class="hud hud-tl">
        <div class="hud-title">三维体视图 · 多层切片叠加</div>
        <div class="hud-sub" id="hud-axis">切片主轴：—</div>
      </div>

      <div class="hud hud-tr">
        <div class="fps" id="fps-readout">FPS —</div>
        <div class="quality" id="quality-readout">分辨率 100%</div>
      </div>

      <div class="hud hud-bl">
        <div id="pick-readout" class="pick-readout" hidden>
          <div class="pick-title">采样点 <button class="pick-clear" id="pick-clear" title="清除标注">×</button></div>
          <div class="pick-coord" id="pick-coord"></div>
          <div class="pick-value">浓度 <b id="pick-value"></b></div>
        </div>
        <p class="view-hint">左键旋转 · 右键平移 · 滚轮缩放 · 单击浓度场采样</p>
      </div>

      <div class="overlay" id="loading-overlay">
        <div class="overlay-card">
          <div class="spinner"></div>
          <p id="overlay-text">等待加载体数据…</p>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
